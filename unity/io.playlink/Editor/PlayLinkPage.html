<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>PlayLink</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; font-family: system-ui, sans-serif; color: #ccc; }
  canvas { position: fixed; left: 0; top: 0; touch-action: none; display: block; }
  #status { position: fixed; left: 0; right: 0; top: 45%; text-align: center; font-size: 15px; color: #888; pointer-events: none; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,.55);
    font-size: 18px; color: #fff; text-align: center; line-height: 1.6; z-index: 3; }
  #hud { position: fixed; left: 6px; top: 6px; padding: 4px 6px; background: rgba(0,0,0,.6); color: #7f7; font: 11px/1.35 monospace;
    white-space: pre; pointer-events: none; z-index: 2; display: none; }
  .btn { position: fixed; right: 6px; width: 30px; height: 30px; border-radius: 15px; background: rgba(255,255,255,.12);
    color: rgba(255,255,255,.6); font: 15px/30px monospace; text-align: center; z-index: 2; touch-action: none; }
  #hudBtn { top: 6px; }
  #fsBtn { top: 42px; }
  #warn { position: fixed; left: 8px; right: 44px; bottom: 12px; padding: 8px 10px; border-radius: 6px; background: rgba(60,40,0,.85);
    color: #ffd54a; font-size: 14px; line-height: 1.4; pointer-events: none; z-index: 2; display: none; }
  #take { position: fixed; left: 50%; top: 55%; transform: translateX(-50%); padding: 12px 22px; border-radius: 8px; background: #ffd54a;
    color: #221a00; font-size: 17px; font-weight: 600; z-index: 4; touch-action: none; display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="status">연결 중…</div>
<div id="hud"></div>
<div id="hudBtn" class="btn">i</div>
<div id="fsBtn" class="btn">⛶</div>
<div id="warn"></div>
<div id="take">여기서 보기</div>
<div id="start">탭하면 전체 화면으로 시작합니다<br><small>(Unity Play + PlayLink Start 필요)</small></div>
<script>
'use strict';
const HEADER_BYTES = 28;
// 서버(PlayLinkCapture.PROTOCOL_VERSION)와 같아야 합니다. 서버가 접속 직후 {t:"hello", v}로 알려 주고, 다르면 이 페이지를 새로 고칩니다.
const PROTOCOL_VERSION = 2;
const qs = new URLSearchParams(location.search);
const canvas = document.getElementById('c');
// desynchronized(저지연 캔버스)는 쓰지 않습니다. Android Chrome에서 앞 버퍼에 바로 그리는 모드라 그리는 도중 상태(검은 바탕 등)가
// 그대로 화면에 나가 검게 깨져 보일 수 있습니다(2단계 후속 보고서 참고).
// ?desync=1 은 수정 전 그리기 방식(저지연 캔버스 + 매 프레임 전체 검정 칠)으로 되돌린 A/B 비교용입니다.
const legacyDraw = qs.get('desync') === '1';
// 워커 경로(기본)에서는 캔버스를 워커로 넘기므로 여기서 컨텍스트를 만들지 않습니다(한 번 만들면 넘길 수 없음). 아래 "영상 워커" 참고.
const mainThreadVideo = qs.get('worker') === '0' || legacyDraw || typeof Worker === 'undefined' || !('transferControlToOffscreen' in canvas);
let videoWorker = null;
const ctx = mainThreadVideo ? canvas.getContext('2d', legacyDraw ? { alpha: false, desynchronized: true } : { alpha: false }) : null;
const statusEl = document.getElementById('status');
const warnEl = document.getElementById('warn');
const takeEl = document.getElementById('take');
// 메인 스레드 경로의 영상 소켓([여기서 보기]가 씀). 워커 경로에서는 워커가 소켓을 갖습니다.
let mainVideoWs = null;
const hudEl = document.getElementById('hud');
const startEl = document.getElementById('start');
const fsBtn = document.getElementById('fsBtn');

// 테스트/디버그용으로 밖에서 읽을 수 있게 둡니다.
const gvr = window.gvr = {
  frames: [],          // 최근 프레임 기록 {id, seq, same, bytes, w, h, encMs, srvMs, recvAt, drawnAt, decodeMs}
  touchToFrame: [],    // 입력 전송 → 그 입력이 반영된 프레임 표시까지(ms)
  inputsSent: [],      // {seq, t, type, x, y, at}
  // dropped = 디코더가 바빠 버린 수(MJPEG), superseded = 디코딩 뒤 그리지 않고 버린 수, catchups = 그리기 대기열이 넘쳐 최신으로 건너뛴 횟수
  // late = 표시 예정 시각이 지난 뒤에 도착한 프레임 수(표시 일정이 켜져 있을 때), keyRequests = 디코더가 밀려 키프레임을 다시 요청한 횟수
  rtt: 0, fps: 0, kbps: 0, dropped: 0, superseded: 0, catchups: 0, late: 0, keyRequests: 0, connected: { video: false, input: false },
  // 표시 간격(끊김 진단): 1초 창의 최대 간격, 50ms 넘는 간격 수
  gapMaxMs: 0, gaps50: 0,
};

let dpr = 1;
let imgW = 0, imgH = 0;
const rect = { x: 0, y: 0, w: 0, h: 0 };
let bitmap = null;
let needsClear = true;

// 캔버스 크기를 바꾸면 내용이 지워지므로 실제로 바뀔 때만 바꾸고, 같은 작업 안에서 마지막 이미지를 바로 다시 그립니다.
function resize() {
  dpr = window.devicePixelRatio || 1;
  // CSS 크기는 두 경로 공통입니다. 워커 경로에서는 캔버스 픽셀 크기와 배치를 워커가 정합니다.
  if (!mainThreadVideo) {
    canvas.style.width = `${innerWidth}px`;
    canvas.style.height = `${innerHeight}px`;
    if (videoWorker) { videoWorker.postMessage({ t: 'view', view: { w: innerWidth, h: innerHeight, dpr } }); }
    return;
  }
  const w = Math.round(innerWidth * dpr);
  const h = Math.round(innerHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
    needsClear = true;
  }
  // CSS 크기를 배치 계산(innerWidth/innerHeight)과 똑같이 맞춥니다. 100vh는 주소창이 보일 때 innerHeight와 달라 이미지가 늘어나고 터치 좌표가 어긋납니다.
  canvas.style.width = `${innerWidth}px`;
  canvas.style.height = `${innerHeight}px`;
  layout();
  draw();
}

// 이미지 비율을 지키며 화면 가운데에 맞춥니다(남는 곳은 검은 여백).
function layout() {
  if (!imgW) { return; }
  const s = Math.min(innerWidth / imgW, innerHeight / imgH);
  rect.w = imgW * s; rect.h = imgH * s;
  rect.x = (innerWidth - rect.w) / 2; rect.y = (innerHeight - rect.h) / 2;
  needsClear = true;
}

// 새 이미지가 있을 때만 그립니다. 여백은 배치가 바뀔 때만 칠하고, 이미지 영역은 매번 새 이미지로 덮어씁니다(지우지 않음).
function draw() {
  if (!mainThreadVideo) {
    if (videoWorker) { videoWorker.postMessage({ t: 'redraw' }); }
    return;
  }
  if (!bitmap) { return; }
  if (needsClear || legacyDraw) {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    needsClear = false;
  }
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  // 장치 픽셀 정수 경계로 그려 가장자리 1px가 이전 이미지와 섞이지 않게 합니다.
  const x = Math.round(rect.x * dpr);
  const y = Math.round(rect.y * dpr);
  ctx.drawImage(bitmap, x, y, Math.round((rect.x + rect.w) * dpr) - x, Math.round((rect.y + rect.h) * dpr) - y);
}

addEventListener('resize', resize);
document.addEventListener('fullscreenchange', resize);
if (window.visualViewport) { visualViewport.addEventListener('resize', resize); }
resize();

// 탭이 다시 보이거나 GPU 컨텍스트가 복구되면 마지막 이미지를 바로 다시 그립니다(다음 프레임을 기다리지 않음).
// 숨겨진 동안은 디코딩하지 않고 최신 1장만 받아 두었다가, 다시 보이면 그것부터 디코딩합니다.
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { return; }
  needsClear = true;
  draw();
  pumpDecodes();
});
addEventListener('pageshow', () => { needsClear = true; draw(); });
canvas.addEventListener('contextrestored', () => { needsClear = true; draw(); });

// ---------- 화면 검사(검은/깨진 프레임 계측) ----------
// 디코딩한 이미지와 실제 화면 캔버스를 18x32로 줄여 거의 검은 픽셀 비율을 봅니다(서버 검사와 같은 기준).
// 픽셀 읽기는 GPU를 기다리게 할 수 있어서 평소에는 PROBE_EVERY장마다 1장만, 디버그 표시(i)가 켜져 있으면 PROBE_EVERY_HUD장마다 1장 + 화면 캔버스(1초마다)까지 봅니다.
// 디버그 표시 중에 매 프레임 읽으면 끊김을 보려고 켠 표시가 끊김을 만들 수 있어서 표본으로만 봅니다(H.264 VideoFrame은 GPU 텍스처).
// JPEG 표지(SOI/EOI), 디코딩 실패, 크기 불일치, 컨텍스트 손실은 항상 모든 프레임을 셉니다.
const BLACK_FRACTION = 0.97;
const PROBE_EVERY = 30;
const PROBE_EVERY_HUD = 10;
const check = gvr.check = { frames: 0, probed: 0, black: 0, jpegBad: 0, sizeBad: 0, decodeErr: 0, canvasBlack: 0, ctxLost: 0, lastBad: 0, log: [] };
const probe = document.createElement('canvas');
probe.width = 18; probe.height = 32;
const probeCtx = probe.getContext('2d', { willReadFrequently: true });

function darkRatio(src, sx, sy, sw, sh) {
  probeCtx.drawImage(src, sx, sy, sw, sh, 0, 0, probe.width, probe.height);
  const d = probeCtx.getImageData(0, 0, probe.width, probe.height).data;
  let dark = 0;
  for (let i = 0; i < d.length; i += 4) {
    if (d[i] + d[i + 1] + d[i + 2] < 24) { dark++; }
  }
  return dark / (d.length / 4);
}

function markBad(kind, id) {
  check[kind]++;
  check.lastBad = id;
  check.log.push({ kind, id, at: Math.round(performance.now()) });
  if (check.log.length > 100) { check.log.shift(); }
}

// 화면에 실제로 남아 있는 캔버스가 검은데 마지막으로 그린 이미지는 검지 않으면 "화면 캔버스 검정"
setInterval(() => {
  const f = gvr.last;
  if (!hudOn || !f || !bitmap || document.hidden || rect.w < 1) { return; }
  // 프레임 검사는 표본이라 마지막 프레임에 값이 없을 수 있어서, 지금 그려 둔 이미지를 여기서 직접 봅니다(1초에 1번).
  try {
    const dark = darkRatio(canvas, rect.x * dpr, rect.y * dpr, rect.w * dpr, rect.h * dpr);
    if (dark >= BLACK_FRACTION && darkRatio(bitmap, 0, 0, f.w, f.h) < 0.5) { markBad('canvasBlack', f.id); }
  } catch (e) {
    // 검사 실패(이미지가 막 닫힘 등)는 무시합니다.
  }
}, 1000);

canvas.addEventListener('contextlost', () => { markBad('ctxLost', gvr.last ? gvr.last.id : 0); });

setInterval(() => {
  if (inputWs && inputWs.readyState === 1) {
    // dm = 한 장당 디코딩 비용(평균 디코딩 시간 / 병렬 디코더 수), dp = 지난 보고 뒤 디코더가 바빠 버린 프레임 수. 서버의 자동 프레임 간격이 씁니다.
    // 평균이 아니라 중앙값을 씁니다. 페이지를 막 열었거나 디코더를 다시 만든 직후의 몇 장(수십~수백 ms)이 평균을 끌어올려
    // 서버가 "폰 디코딩이 못 따라간다"고 보고 30fps로 내리는 일이 있었습니다(실측: 보고값 26.8ms, 실제 6ms).
    const recent = gvr.frames.slice(-60).map((f) => f.decodeMs || 0).sort((a, b) => a - b);
    const dm = recent.length ? recent[recent.length >> 1] / MAX_DECODES : 0;
    const dp = gvr.dropped - droppedReported;
    droppedReported = gvr.dropped;
    inputWs.send(JSON.stringify({ t: 'q', dm: Math.round(dm * 10) / 10, dp, fr: check.frames, bk: check.black, jb: check.jpegBad, sz: check.sizeBad, de: check.decodeErr,
      cb: check.canvasBlack, cl: check.ctxLost, lb: check.lastBad }));
  }
}, 2000);

// ---------- H.264 (WebCodecs) ----------
// 헤더 flags: 2 = H.264, 4 = 키프레임, 8 = 설정(avcC). 설정이 오면 디코더를 새로 만들고, 프레임(AVCC NAL)은 순서대로 decode합니다.
// WebCodecs는 보안 컨텍스트에서만 됩니다(http://localhost = adb reverse는 됨, http://<PC IP> = Wi-Fi 직접은 안 됨 → MJPEG).
const FLAG_H264 = 2, FLAG_KEY = 4, FLAG_CONFIG = 8;
const H264_PROBE_CODEC = 'avc1.640028';
const h264Support = ('VideoDecoder' in window && window.isSecureContext)
  ? VideoDecoder.isConfigSupported({ codec: H264_PROBE_CODEC, hardwareAcceleration: 'prefer-hardware', optimizeForLatency: true })
    .then((r) => !!r.supported).catch(() => false)
  : Promise.resolve(false);
h264Support.then((ok) => { gvr.h264Supported = ok; });
let h264Decoder = null;
let h264WaitingKey = true;
// 디코더에 밀린 프레임이 이 수를 넘으면(폰 디코더가 못 따라감) 더 넣지 않고 디코더를 버린 뒤 키프레임을 요청합니다. 지연이 쌓이는 대신 한 번 건너뜁니다.
// 디코더를 막 만든 직후에는 첫 프레임이 나오기 전까지 몇 장이 쌓이는 것이 정상이라(하드웨어 디코더 준비 시간), 첫 출력이 나온 뒤부터 봅니다.
const DECODE_QUEUE_LIMIT = 6;
let h264Outputs = 0;
// 키프레임 요청에 답이 없으면(요청 유실 등) 이 간격으로 다시 요청합니다.
const KEY_REQUEST_RETRY_MS = 1500;
let lastKeyRequestAt = 0;

function requestKeyframe(ws) {
  const now = performance.now();
  if (now - lastKeyRequestAt < KEY_REQUEST_RETRY_MS || ws.readyState !== 1) { return; }
  lastKeyRequestAt = now;
  gvr.keyRequests++;
  ws.send(JSON.stringify({ t: 'key' }));
}
const h264Pending = new Map();

function resetH264() {
  if (h264Decoder && h264Decoder.state !== 'closed') { h264Decoder.close(); }
  h264Decoder = null;
  h264WaitingKey = true;
  h264Pending.clear();
}

function parseHeader(data) {
  const dv = new DataView(data);
  return {
    id: dv.getUint32(0, true), w: dv.getUint16(4, true), h: dv.getUint16(6, true), seq: dv.getInt32(8, true),
    encMs: dv.getUint32(12, true) / 1000, srvMs: dv.getUint32(16, true) / 1000, flags: dv.getUint32(20, true),
    cap: dv.getUint32(24, true) / 10, bytes: data.byteLength, recvAt: performance.now(),
  };
}

function handleH264(data, ws) {
  const f = parseHeader(data);
  f.same = false;
  f.codec = 'h264';
  const payload = new Uint8Array(data, HEADER_BYTES);
  if (f.flags & FLAG_CONFIG) {
    // avcC 1~3바이트 = profile, compatibility, level → 코덱 문자열
    const hex = (b) => b.toString(16).padStart(2, '0');
    const codec = `avc1.${hex(payload[1])}${hex(payload[2])}${hex(payload[3])}`;
    resetH264();
    const gen = videoGen;
    h264Outputs = 0;
    h264Decoder = new VideoDecoder({
      output: (frame) => {
        h264Outputs++;
        const meta = h264Pending.get(frame.timestamp);
        h264Pending.delete(frame.timestamp);
        if (!meta || gen !== videoGen) { frame.close(); return; }
        meta.decodeMs = performance.now() - meta.decodeStart;
        if (frame.displayWidth !== meta.w || frame.displayHeight !== meta.h) { markBad('sizeBad', meta.id); frame.close(); return; }
        queuePresent(frame, meta, gen);
      },
      error: () => {
        // 디코딩 오류: 디코더를 버리고 서버에 키프레임(인코더 재시작)을 요청합니다. 그동안 마지막 화면이 남습니다.
        markBad('decodeErr', f.id);
        resetH264();
        requestKeyframe(ws);
      },
    });
    h264Decoder.configure({ codec, description: payload, hardwareAcceleration: 'prefer-hardware', optimizeForLatency: true });
    gvr.h264Codec = codec;
    return;
  }
  // 디코더가 없는데 프레임이 오면(오류나 밀림으로 버린 뒤) 설정 + 키프레임이 올 때까지 요청을 되풀이합니다. 앞 프레임에 기대는 프레임은 버립니다.
  if (!h264Decoder || h264Decoder.state !== 'configured') { requestKeyframe(ws); return; }
  const key = (f.flags & FLAG_KEY) !== 0;
  if (h264WaitingKey && !key) { return; }
  if (h264Outputs > 0 && h264Decoder.decodeQueueSize > DECODE_QUEUE_LIMIT) {
    resetH264();
    requestKeyframe(ws);
    return;
  }
  h264WaitingKey = false;
  f.decodeStart = performance.now();
  h264Pending.set(f.id, f);
  try {
    h264Decoder.decode(new EncodedVideoChunk({ type: key ? 'key' : 'delta', timestamp: f.id, data: payload }));
  } catch (e) {
    markBad('decodeErr', f.id);
    resetH264();
    requestKeyframe(ws);
  }
}

// ---------- 영상 ----------
let videoWs = null;
// 디코딩은 최대 MAX_DECODES개를 동시에 돌립니다(createImageBitmap은 메인 스레드 밖에서 디코딩). 폰 디코딩이 프레임 간격(60fps 16.7ms)에
// 가까워도 따라갈 수 있게 합니다. 끝난 순서와 상관없이 받은 순서(decodeQueue)대로 그리기 대기열에 넘겨, 늦게 끝난 이전 프레임이 버려져
// 화면 내용이 한 장씩 건너뛰는 일이 없게 합니다.
const MAX_DECODES = 2;
let pendingData = null;
let decodesInFlight = 0;
let videoGen = 0;
let newestDecodedId = 0;
const decodeQueue = [];
let droppedReported = 0;
// 그리기 대기열: 화면 갱신(rAF)마다 1장씩 그립니다. 두 장이 한 갱신 안에 끝나도 한 장을 건너뛰지 않게 2장까지 두고,
// 더 쌓이면(폰 표시가 못 따라가거나 프레임이 몰려 도착) 가장 새 것 1장만 남기고 버려 지연이 쌓이지 않게 합니다.
const MAX_PRESENT_QUEUE = 2;
const presentQueue = [];
let presentScheduled = false;
let bytesWindow = 0, framesWindow = 0;

function connectVideo() {
  const ws = new WebSocket(`ws://${location.host}/video`);
  mainVideoWs = ws;
  ws.binaryType = 'arraybuffer';
  // 서버를 다시 시작하면 frameId가 0부터 다시 시작하므로 연결마다 세대를 나눕니다.
  ws.onopen = () => {
    videoGen++;
    newestDecodedId = 0;
    // 서버를 다시 시작하면 캡처 시각도 0부터 다시 시작하므로 표시 일정을 비웁니다(그리지 않은 프레임은 닫음).
    resetSched();
    resetH264();
    gvr.connected.video = true;
    updateStatus();
    // H.264를 디코딩할 수 있는지 알립니다. 서버는 이 답을 받은 뒤 H.264로 바꿉니다(못 하면 계속 MJPEG).
    h264Support.then((ok) => { if (ws.readyState === 1) { ws.send(JSON.stringify({ t: 'caps', h264: ok ? 1 : 0 })); } });
  };
  ws.onclose = () => { gvr.connected.video = false; updateStatus(); setTimeout(connectVideo, 700); };
  ws.onerror = () => {};
  ws.onmessage = (ev) => {
    if (typeof ev.data === 'string') {
      showServerStatus(ev.data);
      return;
    }
    // 받자마자 확인을 보내 서버가 다음 최신 프레임을 보내게 합니다(디코딩과 겹쳐 진행).
    ws.send('a');
    bytesWindow += ev.data.byteLength;
    // H.264는 앞 프레임에 기대므로 버리지 않고 받은 순서대로 바로 디코더에 넣습니다.
    if (ev.data.byteLength >= HEADER_BYTES && (new DataView(ev.data).getUint32(20, true) & FLAG_H264)) {
      handleH264(ev.data, ws);
      return;
    }
    if (pendingData) { gvr.dropped++; }
    pendingData = { data: ev.data, recvAt: performance.now(), gen: videoGen };
    pumpDecodes();
  };
  videoWs = ws;
}

// 대기 중인 최신 프레임을 빈 디코더에 넘깁니다. 디코더가 모두 바쁜 동안 새 프레임이 오면 대기 프레임을 덮어씁니다(gvr.dropped).
function pumpDecodes() {
  while (pendingData && decodesInFlight < MAX_DECODES && !document.hidden) {
    const item = pendingData;
    pendingData = null;
    decodesInFlight++;
    const entry = { done: false, bmp: null, f: null, gen: item.gen };
    decodeQueue.push(entry);
    decodeOne(item, entry).catch(() => { markBad('decodeErr', 0); }).finally(() => {
      entry.done = true;
      decodesInFlight--;
      releaseDecoded();
      pumpDecodes();
    });
  }
}

// 앞에서부터 끝난 것만 순서대로 그리기 대기열로 넘깁니다. 앞의 것이 아직 디코딩 중이면 뒤의 것은 기다립니다.
function releaseDecoded() {
  while (decodeQueue.length && decodeQueue[0].done) {
    const { bmp, f, gen } = decodeQueue.shift();
    if (bmp) { queuePresent(bmp, f, gen); }
  }
}

// 손상된 JPEG, 디코딩 실패, 크기가 헤더와 다른 프레임은 그리지 않고 이전 이미지를 둡니다.
async function decodeOne({ data, recvAt }, entry) {
  if (data.byteLength < HEADER_BYTES + 4) {
    markBad('jpegBad', 0);
    return;
  }
  const dv = new DataView(data);
  const f = {
    id: dv.getUint32(0, true), w: dv.getUint16(4, true), h: dv.getUint16(6, true), seq: dv.getInt32(8, true),
    encMs: dv.getUint32(12, true) / 1000, srvMs: dv.getUint32(16, true) / 1000, same: (dv.getUint32(20, true) & 1) === 1,
    cap: dv.getUint32(24, true) / 10, bytes: data.byteLength, recvAt,
  };
  const jpeg = new Uint8Array(data, HEADER_BYTES);
  if (jpeg.length < 4 || jpeg[0] !== 0xFF || jpeg[1] !== 0xD8 || jpeg[jpeg.length - 2] !== 0xFF || jpeg[jpeg.length - 1] !== 0xD9) {
    markBad('jpegBad', f.id);
    return;
  }
  let bmp;
  const t0 = performance.now();
  try {
    bmp = await createImageBitmap(new Blob([jpeg], { type: 'image/jpeg' }));
  } catch (e) {
    markBad('decodeErr', f.id);
    return;
  }
  f.decodeMs = performance.now() - t0;
  if (bmp.width !== f.w || bmp.height !== f.h) {
    markBad('sizeBad', f.id);
    bmp.close();
    return;
  }
  entry.bmp = bmp;
  entry.f = f;
}

// ---------- 표시 일정 ----------
// 프레임을 "디코딩이 끝난 순서대로 다음 화면 갱신에" 그리면 도착 · 디코딩 시간의 흔들림(수 ms)이 그대로 표시 간격의 흔들림이 됩니다.
// 폰 화면이 60Hz일 때는 16.7ms 칸에 묻히지만, 터치하면 폰이 120Hz로 올라가(삼성 가변 주사율) 8.3ms 칸이 되어 60fps 영상이 8 / 17 / 25ms 간격으로
// 섞여 그려집니다(터치할 때만 끊겨 보이던 원인, 개발 문서 12.8). 그래서 서버가 헤더에 넣어 준 캡처 시각(f.cap)을 기준으로 표시 예정 시각을 정합니다.
//   표시 예정 = 캡처 시각 + base(최근 10초 중 가장 빨리 도착한 프레임의 "디코딩 완료 − 캡처", 두 시계의 차이 포함) + delay(흔들림 여유)
//   delay = 최근 프레임들의 흔들림 95% 지점 + 2ms. 처음에는 1프레임(16.7ms), 범위 3~25ms. 흔들림이 커지면 늘고 안정되면 줄어듭니다.
//   화면 갱신(rAF)마다 예정 시각이 지난 프레임 중 가장 새 것 1장을 그리고, 그보다 오래된 것은 버립니다(닫음). 예정 시각 전에 도착한 프레임은
//   항상 제 칸(예정 시각 뒤 첫 갱신)에 그려집니다.
//   phase = 예정 시각이 갱신 시각(칸 경계)에 걸쳐 한 칸씩 흔들리지 않게 칸 가운데로 천천히 맞추는 보정(±반 칸). Unity fps와 폰 주사율이 조금 달라
//   보정이 3/4칸을 넘으면 한 칸 넘깁니다(gvr.sched.slips: 60Hz에서는 1장 건너뜀/반복, 120Hz에서는 한 번 8ms 빠르거나 늦음).
//   넘긴 뒤에는 반대쪽 1/4칸 자리라 경계에서 왔다 갔다 하지 않습니다.
//   주사율(칸 길이)은 rAF 간격으로 재므로, 프레임이 오는 동안에는 대기열이 비어도 rAF를 이어 갑니다(SCHED_KEEPALIVE_MS).
// ?sched=0 이면 끄고 예전 방식(도착 순서대로 갱신마다 1장)으로 그립니다(비교용).
// ?buffer=N (ms) 이면 delay를 N 이상으로 둡니다(무선처럼 가끔 수십 ms씩 늦게 오는 링크에서 고르게 보려고 지연을 더 주는 선택, 예: ?buffer=50).
// 주지 않으면 흔들림의 95% 지점만 따라가므로(낮은 지연 우선) 그보다 늦게 온 프레임은 한 번 멈췄다가 건너뜁니다.
const schedOn = qs.get('sched') !== '0';
const schedBufferMs = Math.min(200, Math.max(0, Number(qs.get('buffer')) || 0));
const SCHED_START_DELAY_MS = 16.7;
const SCHED_MIN_DELAY_MS = 3;
const SCHED_MAX_DELAY_MS = 25;
const SCHED_MARGIN_MS = 2;
const SCHED_BASE_WINDOW_MS = 10000;
const SCHED_JITTER_SAMPLES = 120;
const SCHED_MAX_QUEUE = 6;
const SCHED_PHASE_GAIN = 0.1;
const SCHED_KEEPALIVE_MS = 300;
const sched = gvr.sched = { on: schedOn, delay: Math.max(schedBufferMs, SCHED_START_DELAY_MS), phase: 0, vsync: 16.7, slips: 0 };
const schedBase = [];
const schedJitter = [];
let schedSamples = 0;
let lastRafAt = 0;
let lastEnqueueAt = 0;

function resetSched() {
  schedBase.length = 0;
  schedJitter.length = 0;
  schedSamples = 0;
  sched.delay = Math.max(schedBufferMs, SCHED_START_DELAY_MS);
  sched.phase = 0;
  while (presentQueue.length) { presentQueue.shift().bmp.close(); }
}

// 디코딩이 끝난 프레임의 표시 예정 시각을 정해 대기열에 넣습니다.
function schedEnqueue(bmp, f) {
  const now = performance.now();
  const v = now - f.cap;
  // 최근 SCHED_BASE_WINDOW_MS 동안의 최솟값(앞쪽이 최솟값인 단조 대기열)
  while (schedBase.length && schedBase[schedBase.length - 1].v >= v) { schedBase.pop(); }
  schedBase.push({ at: now, v });
  while (schedBase[0].at < now - SCHED_BASE_WINDOW_MS) { schedBase.shift(); }
  const base = schedBase[0].v;
  schedJitter.push(v - base);
  if (schedJitter.length > SCHED_JITTER_SAMPLES) { schedJitter.shift(); }
  schedSamples++;
  if (schedJitter.length >= 30 && schedSamples % 10 === 0) {
    const sorted = schedJitter.slice().sort((a, b) => a - b);
    const p95 = sorted[Math.floor(sorted.length * 0.95)];
    sched.delay = Math.max(schedBufferMs, Math.min(SCHED_MAX_DELAY_MS, Math.max(SCHED_MIN_DELAY_MS, p95 + SCHED_MARGIN_MS)));
  }
  f.due = f.cap + base + sched.delay;
  lastEnqueueAt = now;
  if (now > f.due) { gvr.late++; }
  presentQueue.push({ bmp, f });
  // 탭이 가려져 rAF가 멈춘 동안 등: 가장 오래된 것부터 버립니다.
  while (presentQueue.length > SCHED_MAX_QUEUE) {
    presentQueue.shift().bmp.close();
    gvr.superseded++;
  }
}

// 이번 화면 갱신(t)에 그릴 프레임을 꺼냅니다. 아직 차례가 아니면 null. 주사율을 재려고 대기열이 비어 있어도 매 갱신 부릅니다.
function schedTake(t) {
  if (lastRafAt && t > lastRafAt && t - lastRafAt < 50) { sched.vsync += 0.1 * (t - lastRafAt - sched.vsync); }
  lastRafAt = t;
  const half = sched.vsync / 2;
  let pick = -1;
  for (let i = 0; i < presentQueue.length; i++) {
    if (presentQueue[i].f.due + sched.phase > t) { break; }
    pick = i;
  }
  if (pick < 0) { return null; }
  for (let i = 0; i < pick; i++) {
    presentQueue.shift().bmp.close();
    gvr.superseded++;
  }
  const item = presentQueue.shift();
  // r = 예정 시각이 이번 칸의 어디에 있었는지(0 ~ 칸 길이). 가운데(반 칸)로 오게 phase를 조금씩 옮깁니다.
  // 제 칸에 그린 프레임만 보정에 씁니다(늦게 도착한 프레임을 쫓아가면 지연이 쌓임).
  const r = t - (item.f.due + sched.phase);
  if (r < sched.vsync) {
    sched.phase += SCHED_PHASE_GAIN * (r - half);
    if (sched.phase > sched.vsync * 0.75) { sched.phase -= sched.vsync; sched.slips++; }
    else if (sched.phase < -sched.vsync * 0.75) { sched.phase += sched.vsync; sched.slips++; }
  }
  return item;
}

// ---------- 영상 워커 ----------
// 영상 소켓 수신 · 디코딩 · 표시 일정 · 그리기를 전부 워커(OffscreenCanvas)에서 합니다.
// 이유: 손가락이 화면에 닿아 있는 동안 Chrome은 메인 스레드의 네트워크 수신 작업을 미룹니다(터치 응답을 우선하는 스케줄러 정책).
// 영상을 메인 스레드에서 받으면 누르고 있는 60~150ms 동안 프레임이 한 장도 전달되지 않다가 손을 떼는 순간 몰려 와서,
// 탭할 때마다 화면이 멈췄다가 건너뛰었습니다(실측, 개발 문서 12.9). 수신 확인("a")도 같이 밀려 서버 쪽 역압까지 건드렸습니다.
// 워커는 그 정책의 영향을 받지 않습니다. 메인 스레드는 터치 입력(입력 소켓), 배치 크기 전달, 통계 표시만 합니다.
// 이 함수는 문자열로 바뀌어 워커 안에서 실행되므로 바깥 변수를 쓰지 않습니다. 표시 일정은 메인 경로(schedEnqueue/schedTake)와 같은 알고리즘입니다.
// ?worker=0 이면 쓰지 않고 예전처럼 메인 스레드에서 처리합니다(비교용, 픽셀 검사 진단은 메인 경로에만 있음).
function gvrVideoWorker() {
  const HEADER_BYTES = 28, FLAG_H264 = 2, FLAG_KEY = 4, FLAG_CONFIG = 8;
  const DECODE_QUEUE_LIMIT = 6, KEY_REQUEST_RETRY_MS = 1500, MAX_JPEG_DECODES = 2, MAX_PRESENT_QUEUE = 2;
  const SCHED_START_DELAY_MS = 16.7, SCHED_MIN_DELAY_MS = 3, SCHED_MAX_DELAY_MS = 25, SCHED_MARGIN_MS = 2;
  const SCHED_BASE_WINDOW_MS = 10000, SCHED_JITTER_SAMPLES = 120, SCHED_MAX_QUEUE = 6, SCHED_PHASE_GAIN = 0.1, SCHED_KEEPALIVE_MS = 300;
  let cfg = null, canvas = null, ctx = null, ws = null, timeOffset = 0;
  let view = { w: 0, h: 0, dpr: 1 };
  const rect = { x: 0, y: 0, w: 0, h: 0 };
  let imgW = 0, imgH = 0, bitmap = null, needsClear = true;
  let gen = 0, newestId = 0;
  let decoder = null, waitingKey = true, outputs = 0, lastKeyAt = 0, codecName = '';
  const pending = new Map();
  let jpegInFlight = 0, jpegNext = null;
  const queue = [];
  let rafPending = false, lastRafAt = 0, lastEnqueueAt = 0, schedSamples = 0;
  const stat = { superseded: 0, late: 0, dropped: 0, keyRequests: 0, decodeErr: 0, frames: 0, bytes: 0, catchups: 0 };
  const sched = { on: true, delay: SCHED_START_DELAY_MS, phase: 0, vsync: 16.7, slips: 0 };
  const schedBase = [], schedJitter = [];

  function layout() {
    if (!imgW || !view.w) { return; }
    const s = Math.min(view.w / imgW, view.h / imgH);
    rect.w = imgW * s; rect.h = imgH * s;
    rect.x = (view.w - rect.w) / 2; rect.y = (view.h - rect.h) / 2;
    needsClear = true;
    postMessage({ t: 'rect', rect, imgW, imgH });
  }

  function applyView() {
    const w = Math.round(view.w * view.dpr), h = Math.round(view.h * view.dpr);
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    needsClear = true;
    layout();
    draw();
  }

  function draw() {
    if (!bitmap || !ctx) { return; }
    if (needsClear) {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      needsClear = false;
    }
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    const d = view.dpr;
    const x = Math.round(rect.x * d), y = Math.round(rect.y * d);
    ctx.drawImage(bitmap, x, y, Math.round((rect.x + rect.w) * d) - x, Math.round((rect.y + rect.h) * d) - y);
  }

  function resetSched() {
    schedBase.length = 0; schedJitter.length = 0; schedSamples = 0;
    sched.delay = Math.max(cfg.bufferMs, SCHED_START_DELAY_MS);
    sched.phase = 0;
    while (queue.length) { queue.shift().bmp.close(); }
  }

  function schedEnqueue(bmp, f) {
    const now = performance.now();
    const v = now - f.cap;
    while (schedBase.length && schedBase[schedBase.length - 1].v >= v) { schedBase.pop(); }
    schedBase.push({ at: now, v });
    while (schedBase[0].at < now - SCHED_BASE_WINDOW_MS) { schedBase.shift(); }
    const base = schedBase[0].v;
    schedJitter.push(v - base);
    if (schedJitter.length > SCHED_JITTER_SAMPLES) { schedJitter.shift(); }
    schedSamples++;
    if (schedJitter.length >= 30 && schedSamples % 10 === 0) {
      const sorted = schedJitter.slice().sort((a, b) => a - b);
      const p95 = sorted[Math.floor(sorted.length * 0.95)];
      sched.delay = Math.max(cfg.bufferMs, Math.min(SCHED_MAX_DELAY_MS, Math.max(SCHED_MIN_DELAY_MS, p95 + SCHED_MARGIN_MS)));
    }
    f.due = f.cap + base + sched.delay;
    lastEnqueueAt = now;
    if (now > f.due) { stat.late++; }
    queue.push({ bmp, f });
    while (queue.length > SCHED_MAX_QUEUE) { queue.shift().bmp.close(); stat.superseded++; }
  }

  function schedTake(t) {
    if (lastRafAt && t > lastRafAt && t - lastRafAt < 50) { sched.vsync += 0.1 * (t - lastRafAt - sched.vsync); }
    lastRafAt = t;
    const half = sched.vsync / 2;
    let pick = -1;
    for (let i = 0; i < queue.length; i++) {
      if (queue[i].f.due + sched.phase > t) { break; }
      pick = i;
    }
    if (pick < 0) { return null; }
    for (let i = 0; i < pick; i++) { queue.shift().bmp.close(); stat.superseded++; }
    const item = queue.shift();
    const r = t - (item.f.due + sched.phase);
    if (r < sched.vsync) {
      sched.phase += SCHED_PHASE_GAIN * (r - half);
      if (sched.phase > sched.vsync * 0.75) { sched.phase -= sched.vsync; sched.slips++; }
      else if (sched.phase < -sched.vsync * 0.75) { sched.phase += sched.vsync; sched.slips++; }
    }
    return item;
  }

  function enqueue(bmp, f, g) {
    if (g !== gen || f.id <= newestId) { bmp.close(); stat.superseded++; return; }
    newestId = f.id;
    stat.frames++;
    if (cfg.sched) {
      schedEnqueue(bmp, f);
    } else {
      queue.push({ bmp, f });
      if (queue.length > MAX_PRESENT_QUEUE) {
        stat.catchups++;
        while (queue.length > 1) { queue.shift().bmp.close(); stat.superseded++; }
      }
    }
    if (!rafPending) { rafPending = true; requestAnimationFrame(present); }
  }

  function present(t) {
    rafPending = false;
    const item = cfg.sched ? schedTake(t) : queue.shift();
    if (queue.length || (cfg.sched && performance.now() - lastEnqueueAt < SCHED_KEEPALIVE_MS)) {
      rafPending = true;
      requestAnimationFrame(present);
    }
    if (!item) { return; }
    const previous = bitmap;
    const f = item.f;
    bitmap = item.bmp;
    try {
      if (f.w !== imgW || f.h !== imgH) { imgW = f.w; imgH = f.h; layout(); }
      draw();
    } catch (e) {
      bitmap.close();
      bitmap = previous;
      stat.decodeErr++;
      return;
    }
    if (previous) { previous.close(); }
    const drawnAt = performance.now();
    postMessage({ t: 'frame', f: { id: f.id, w: f.w, h: f.h, seq: f.seq, encMs: f.encMs, srvMs: f.srvMs, cap: f.cap, bytes: f.bytes, same: !!f.same, codec: f.codec,
      decodeMs: f.decodeMs, recvAt: f.recvAt + timeOffset, drawnAt: drawnAt + timeOffset, due: f.due ? f.due + timeOffset : 0 } });
  }

  function resetDecoder() {
    if (decoder && decoder.state !== 'closed') { decoder.close(); }
    decoder = null;
    waitingKey = true;
    pending.clear();
  }

  function requestKeyframe() {
    const now = performance.now();
    if (now - lastKeyAt < KEY_REQUEST_RETRY_MS || !ws || ws.readyState !== 1) { return; }
    lastKeyAt = now;
    stat.keyRequests++;
    ws.send(JSON.stringify({ t: 'key' }));
  }

  function handleH264(data, f) {
    f.codec = 'h264';
    const payload = new Uint8Array(data, HEADER_BYTES);
    if (f.flags & FLAG_CONFIG) {
      const hex = (b) => b.toString(16).padStart(2, '0');
      codecName = `avc1.${hex(payload[1])}${hex(payload[2])}${hex(payload[3])}`;
      resetDecoder();
      const g = gen;
      outputs = 0;
      decoder = new VideoDecoder({
        output: (frame) => {
          outputs++;
          const meta = pending.get(frame.timestamp);
          pending.delete(frame.timestamp);
          if (!meta || g !== gen) { frame.close(); return; }
          meta.decodeMs = performance.now() - meta.decodeStart;
          if (frame.displayWidth !== meta.w || frame.displayHeight !== meta.h) { stat.decodeErr++; frame.close(); return; }
          enqueue(frame, meta, g);
        },
        error: () => { stat.decodeErr++; resetDecoder(); requestKeyframe(); },
      });
      decoder.configure({ codec: codecName, description: payload, hardwareAcceleration: 'prefer-hardware', optimizeForLatency: true });
      return;
    }
    if (!decoder || decoder.state !== 'configured') { requestKeyframe(); return; }
    const key = (f.flags & FLAG_KEY) !== 0;
    if (waitingKey && !key) { return; }
    if (outputs > 0 && decoder.decodeQueueSize > DECODE_QUEUE_LIMIT) { resetDecoder(); requestKeyframe(); return; }
    waitingKey = false;
    f.decodeStart = performance.now();
    pending.set(f.id, f);
    try {
      decoder.decode(new EncodedVideoChunk({ type: key ? 'key' : 'delta', timestamp: f.id, data: payload }));
    } catch (e) {
      stat.decodeErr++;
      resetDecoder();
      requestKeyframe();
    }
  }

  // MJPEG: 최대 MAX_JPEG_DECODES개를 동시에 디코딩하고, 모두 바쁜 동안 온 프레임은 최신 1장만 남깁니다.
  function handleJpeg(data, f) {
    if (jpegInFlight >= MAX_JPEG_DECODES) {
      if (jpegNext) { stat.dropped++; }
      jpegNext = { data, f };
      return;
    }
    jpegInFlight++;
    const g = gen;
    f.same = (f.flags & 1) === 1;
    f.decodeStart = performance.now();
    createImageBitmap(new Blob([new Uint8Array(data, HEADER_BYTES)], { type: 'image/jpeg' })).then((bmp) => {
      f.decodeMs = performance.now() - f.decodeStart;
      if (bmp.width !== f.w || bmp.height !== f.h) { bmp.close(); stat.decodeErr++; return; }
      enqueue(bmp, f, g);
    }, () => { stat.decodeErr++; }).finally(() => {
      jpegInFlight--;
      if (jpegNext) { const n = jpegNext; jpegNext = null; handleJpeg(n.data, n.f); }
    });
  }

  function connect() {
    const socket = new WebSocket(cfg.url);
    socket.binaryType = 'arraybuffer';
    socket.onopen = () => {
      gen++;
      newestId = 0;
      resetSched();
      resetDecoder();
      postMessage({ t: 'conn', video: true });
      const supported = ('VideoDecoder' in self && self.isSecureContext)
        ? VideoDecoder.isConfigSupported({ codec: 'avc1.640028', hardwareAcceleration: 'prefer-hardware', optimizeForLatency: true }).then((r) => !!r.supported).catch(() => false)
        : Promise.resolve(false);
      supported.then((ok) => { if (socket.readyState === 1) { socket.send(JSON.stringify({ t: 'caps', h264: ok ? 1 : 0 })); } postMessage({ t: 'caps', h264: ok }); });
    };
    socket.onclose = () => { postMessage({ t: 'conn', video: false }); setTimeout(connect, 700); };
    socket.onerror = () => {};
    socket.onmessage = (ev) => {
      if (typeof ev.data === 'string') { postMessage({ t: 'text', text: ev.data }); return; }
      socket.send('a');
      stat.bytes += ev.data.byteLength;
      if (ev.data.byteLength < HEADER_BYTES + 4) { return; }
      const dv = new DataView(ev.data);
      const f = { id: dv.getUint32(0, true), w: dv.getUint16(4, true), h: dv.getUint16(6, true), seq: dv.getInt32(8, true),
        encMs: dv.getUint32(12, true) / 1000, srvMs: dv.getUint32(16, true) / 1000, flags: dv.getUint32(20, true), cap: dv.getUint32(24, true) / 10,
        bytes: ev.data.byteLength, recvAt: performance.now() };
      if (f.flags & FLAG_H264) { handleH264(ev.data, f); } else { handleJpeg(ev.data, f); }
    };
    ws = socket;
  }

  self.onmessage = (ev) => {
    const m = ev.data;
    if (m.t === 'init') {
      cfg = m;
      canvas = m.canvas;
      ctx = canvas.getContext('2d', { alpha: false });
      // 메인 스레드와 워커는 performance.now()의 기준 시각이 달라서 메인 기준으로 바꿔 보냅니다.
      timeOffset = performance.timeOrigin - m.timeOrigin;
      sched.on = m.sched;
      view = m.view;
      applyView();
      connect();
      setInterval(() => { postMessage({ t: 'stat', stat, sched, codec: codecName, decodeQueue: decoder ? decoder.decodeQueueSize : -1 }); }, 500);
    } else if (m.t === 'view') {
      view = m.view;
      applyView();
    } else if (m.t === 'redraw') {
      needsClear = true;
      draw();
    } else if (m.t === 'take') {
      // [여기서 보기]: 다른 기기(앱)가 보고 있을 때 영상 자리를 이 페이지로 가져옵니다.
      if (ws && ws.readyState === 1) { ws.send('{"t":"take"}'); }
    }
  };
}

let workerBytes = 0;

function startVideoWorker() {
  const source = `(${gvrVideoWorker.toString()})();`;
  videoWorker = new Worker(URL.createObjectURL(new Blob([source], { type: 'text/javascript' })));
  const offscreen = canvas.transferControlToOffscreen();
  videoWorker.onmessage = (ev) => {
    const m = ev.data;
    if (m.t === 'frame') {
      framesWindow++;
      onFrameShown(m.f);
    } else if (m.t === 'stat') {
      gvr.superseded = m.stat.superseded; gvr.late = m.stat.late; gvr.dropped = m.stat.dropped;
      gvr.keyRequests = m.stat.keyRequests; gvr.catchups = m.stat.catchups;
      check.decodeErr = m.stat.decodeErr; check.frames = m.stat.frames;
      bytesWindow += m.stat.bytes - workerBytes; workerBytes = m.stat.bytes;
      Object.assign(sched, m.sched);
      gvr.h264Codec = m.codec;
      gvr.decodeQueue = m.decodeQueue;
    } else if (m.t === 'rect') {
      rect.x = m.rect.x; rect.y = m.rect.y; rect.w = m.rect.w; rect.h = m.rect.h;
      imgW = m.imgW; imgH = m.imgH;
    } else if (m.t === 'text') {
      showServerStatus(m.text);
    } else if (m.t === 'conn') {
      gvr.connected.video = m.video;
      updateStatus();
    } else if (m.t === 'caps') {
      gvr.h264Supported = m.h264;
    }
  };
  videoWorker.postMessage({ t: 'init', canvas: offscreen, url: `ws://${location.host}/video`, timeOrigin: performance.timeOrigin,
    view: { w: innerWidth, h: innerHeight, dpr }, sched: schedOn, bufferMs: schedBufferMs }, [offscreen]);
}

function queuePresent(bmp, f, gen) {
  // 다른 연결(서버 재시작 전) 것이거나 이미 더 새 프레임을 넘겼으면 버립니다.
  if (gen !== videoGen || f.id <= newestDecodedId) {
    bmp.close();
    gvr.superseded++;
    return;
  }
  newestDecodedId = f.id;
  if (check.frames % (hudOn ? PROBE_EVERY_HUD : PROBE_EVERY) === 0) {
    try {
      f.dark = darkRatio(bmp, 0, 0, f.w, f.h);
      check.probed++;
      if (f.dark >= BLACK_FRACTION) { markBad('black', f.id); }
    } catch (e) {
      // 검사 실패는 그리기를 막지 않습니다.
    }
  }
  check.frames++;
  if (schedOn) {
    schedEnqueue(bmp, f);
  } else {
    presentQueue.push({ bmp, f });
  }
  if (!schedOn && presentQueue.length > MAX_PRESENT_QUEUE) {
    // 넘치면(전송이 잠깐 묶였다가 2~3장이 한꺼번에 도착) 가장 새 것만 남기고 한 번에 건너뜁니다. 오래된 것을 1장씩만 버리면
    // 대기열이 계속 가득 차 있어서 그 뒤 작은 흔들림마다 또 1장씩 빠지고(움직임이 여러 번 튐) 표시 지연도 2장만큼 남습니다.
    gvr.catchups++;
    while (presentQueue.length > 1) {
      presentQueue.shift().bmp.close();
      gvr.superseded++;
    }
  }
  if (!presentScheduled) {
    presentScheduled = true;
    requestAnimationFrame(present);
  }
}

// 새 이미지를 그린 뒤에 이전 이미지를 닫습니다. 디코딩에 실패한 프레임은 여기까지 오지 않아 이전 이미지가 그대로 남습니다.
function present(t) {
  presentScheduled = false;
  const item = schedOn ? schedTake(t) : presentQueue.shift();
  if (presentQueue.length || (schedOn && performance.now() - lastEnqueueAt < SCHED_KEEPALIVE_MS)) {
    presentScheduled = true;
    requestAnimationFrame(present);
  }
  if (!item) { return; }
  const previous = bitmap;
  const { bmp, f } = item;
  bitmap = bmp;
  try {
    // ImageBitmap(JPEG)과 VideoFrame(H.264) 모두 크기는 헤더 값(f.w, f.h)으로 봅니다(VideoFrame에는 width가 없음).
    if (f.w !== imgW || f.h !== imgH) { imgW = f.w; imgH = f.h; layout(); }
    draw();
  } catch (e) {
    // 그리기에 실패하면 새 이미지를 버리고 이전 이미지로 되돌립니다.
    bitmap.close();
    bitmap = previous;
    markBad('decodeErr', f.id);
    return;
  }
  if (previous) { previous.close(); }
  f.drawnAt = performance.now();
  framesWindow++;
  onFrameShown(f);
}

let gapWindowMax = 0, gapWindow50 = 0;

function onFrameShown(f) {
  if (gvr.last && gvr.last.drawnAt) {
    const gap = f.drawnAt - gvr.last.drawnAt;
    gapWindowMax = Math.max(gapWindowMax, gap);
    if (gap > 50) { gapWindow50++; }
  }
  gvr.frames.push(f);
  if (gvr.frames.length > 600) { gvr.frames.shift(); }
  gvr.last = f;
  if (statusEl.textContent) { statusEl.textContent = ''; }
  // 이 프레임에 반영된 입력(seq 이하)의 전송 → 표시 시간
  for (const [seq, sentAt] of pendingInputs) {
    if (seq > f.seq) { continue; }
    const ms = f.drawnAt - sentAt;
    gvr.touchToFrame.push({ seq, ms, frameId: f.id });
    if (gvr.touchToFrame.length > 200) { gvr.touchToFrame.shift(); }
    pendingInputs.delete(seq);
  }
}

// ---------- 입력 ----------
let inputWs = null;
let seq = 0;
const pointers = new Map();
const pendingInputs = new Map();
let flushScheduled = false;

function connectInput() {
  const ws = new WebSocket(`ws://${location.host}/input`);
  ws.onopen = () => { gvr.connected.input = true; updateStatus(); };
  ws.onclose = () => { gvr.connected.input = false; pointers.clear(); updateStatus(); setTimeout(connectInput, 700); };
  ws.onerror = () => {};
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.t === 'P') { gvr.rtt = performance.now() - m.ts; }
  };
  inputWs = ws;
}

function send(t, id, x, y) {
  if (!inputWs || inputWs.readyState !== 1) { return 0; }
  seq++;
  inputWs.send(JSON.stringify({ t, id, x: Math.round(x * 10000) / 10000, y: Math.round(y * 10000) / 10000, s: seq }));
  if (t !== 'm') {
    const now = performance.now();
    pendingInputs.set(seq, now);
    gvr.inputsSent.push({ seq, t, x, y, at: now });
    if (gvr.inputsSent.length > 200) { gvr.inputsSent.shift(); }
  }
  return seq;
}

// 화면 좌표 → 그려진 이미지 기준 0~1 (여백 기준 아님)
function normalize(e) {
  return [(e.clientX - rect.x) / rect.w, (e.clientY - rect.y) / rect.h];
}

const clamp01 = (v) => Math.min(1, Math.max(0, v));

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if (!imgW) { return; }
  const [x, y] = normalize(e);
  if (x < 0 || x > 1 || y < 0 || y > 1) { return; }
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  pointers.set(e.pointerId, { x, y, dirty: false });
  send('d', e.pointerId, x, y);
});

canvas.addEventListener('pointermove', (e) => {
  e.preventDefault();
  const p = pointers.get(e.pointerId);
  if (!p) { return; }
  const [x, y] = normalize(e);
  p.x = clamp01(x); p.y = clamp01(y); p.dirty = true;
  if (!flushScheduled) { flushScheduled = true; requestAnimationFrame(flushMoves); }
});

function endPointer(e, type) {
  e.preventDefault();
  const p = pointers.get(e.pointerId);
  if (!p) { return; }
  if (type === 'u') {
    const [x, y] = normalize(e);
    p.x = clamp01(x); p.y = clamp01(y);
  }
  pointers.delete(e.pointerId);
  send(type, e.pointerId, p.x, p.y);
}

canvas.addEventListener('pointerup', (e) => endPointer(e, 'u'));
canvas.addEventListener('pointercancel', (e) => endPointer(e, 'c'));
canvas.addEventListener('lostpointercapture', (e) => { if (pointers.has(e.pointerId)) { endPointer(e, 'c'); } });
addEventListener('contextmenu', (e) => e.preventDefault());
addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

// 움직임은 애니메이션 프레임당 포인터별 1번만 보냅니다.
function flushMoves() {
  flushScheduled = false;
  for (const [id, p] of pointers) {
    if (!p.dirty) { continue; }
    p.dirty = false;
    send('m', id, p.x, p.y);
  }
}

setInterval(() => {
  if (inputWs && inputWs.readyState === 1) { inputWs.send(JSON.stringify({ t: 'p', ts: performance.now() })); }
}, 1000);

// ---------- 상태 / HUD ----------
// 서버 상태 텍스트 {t:"s", stale, msg}: Unity Game 뷰가 가려지는 등 화면이 멈춘 이유를 화면 아래에 보여 줍니다.
function showServerStatus(text) {
  let m;
  try { m = JSON.parse(text); } catch (e) { return; }
  if (m.t === 'hello') {
    // 서버와 프레임 형식이 다르면(서버만 새로 컴파일됨) 새 페이지를 받습니다. 계속 어긋나도 5초에 1번만 새로 고칩니다.
    if (m.v !== PROTOCOL_VERSION) {
      let last = 0;
      try { last = Number(sessionStorage.getItem('gvrReload')) || 0; } catch (e) {}
      if (Date.now() - last > 5000) {
        try { sessionStorage.setItem('gvrReload', String(Date.now())); } catch (e) {}
        location.reload();
      }
    }
    return;
  }
  if (m.t !== 's') { return; }
  // code "standby": 다른 기기(앱)가 영상을 받고 있어 이 페이지는 기다리는 중입니다. [여기서 보기]로 가져올 수 있습니다.
  const standby = !!m.stale && m.code === 'standby';
  warnEl.textContent = m.stale ? (standby ? m.msg : `화면이 멈춤: ${m.msg}`) : '';
  warnEl.style.display = m.stale ? 'block' : 'none';
  takeEl.style.display = standby ? 'block' : 'none';
}

// 영상 소켓으로 {"t":"take"} 를 보냅니다(서버가 글자 그대로 봄). 누른 뒤에는 서버가 stale:false 를 보내 버튼이 사라집니다.
takeEl.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  e.stopPropagation();
  if (videoWorker) { videoWorker.postMessage({ t: 'take' }); }
  else if (mainVideoWs && mainVideoWs.readyState === 1) { mainVideoWs.send('{"t":"take"}'); }
});
takeEl.addEventListener('click', (e) => { e.stopPropagation(); });

function updateStatus() {
  if (!gvr.connected.video) { statusEl.textContent = '연결 중… (Unity Play + PlayLink Start 필요)'; takeEl.style.display = 'none'; }
}

let hudOn = qs.get('debug') === '1';
hudEl.style.display = hudOn ? 'block' : 'none';
document.getElementById('hudBtn').addEventListener('pointerdown', (e) => {
  e.preventDefault(); e.stopPropagation();
  hudOn = !hudOn; hudEl.style.display = hudOn ? 'block' : 'none';
});

setInterval(() => {
  gvr.fps = framesWindow; gvr.kbps = bytesWindow * 8 / 1000;
  framesWindow = 0; bytesWindow = 0;
  gvr.gapMaxMs = gapWindowMax; gvr.gaps50 = gapWindow50;
  gapWindowMax = 0; gapWindow50 = 0;
  if (!hudOn) { return; }
  const f = gvr.last || {};
  const t2f = gvr.touchToFrame.length ? gvr.touchToFrame[gvr.touchToFrame.length - 1].ms.toFixed(0) : '-';
  hudEl.textContent =
    `${gvr.fps} fps  ${(gvr.kbps / 1000).toFixed(1)} Mbps  gap max ${gvr.gapMaxMs.toFixed(0)} ms (>50ms ${gvr.gaps50})\n` +
    `${f.w || 0}x${f.h || 0}  ${((f.bytes || 0) / 1024).toFixed(0)} KB  ${f.codec === 'h264' ? `H.264 ${gvr.h264Codec || ''}` : 'MJPEG'}${gvr.h264Supported ? '' : ' (H.264 불가)'}\n` +
    `rtt ${gvr.rtt.toFixed(0)} ms  touch→frame ${t2f} ms\n` +
    `enc ${(f.encMs || 0).toFixed(1)} srv ${(f.srvMs || 0).toFixed(1)} dec ${(f.decodeMs || 0).toFixed(1)} ms\n` +
    `dropped ${gvr.dropped}/${gvr.superseded} (catch-up ${gvr.catchups})  ${mainThreadVideo ? 'main' : 'worker'}  ${schedOn ? `sched ${sched.delay.toFixed(0)}ms late ${gvr.late} slip ${sched.slips} vs ${sched.vsync.toFixed(1)}` : 'sched off'}\n` +
    `view ${innerWidth}x${innerHeight}@${dpr}${legacyDraw ? '  DESYNC(A/B)' : ''}\n` +
    `check ${check.frames} (px ${check.probed}) black ${check.black} jpeg ${check.jpegBad} size ${check.sizeBad}\n` +
    `decErr ${check.decodeErr} canvasBlack ${check.canvasBlack} ctxLost ${check.ctxLost}`;
}, 1000);

// ---------- 전체 화면 ----------
function enterFullscreen() {
  const el = document.documentElement;
  if (el.requestFullscreen && !document.fullscreenElement) {
    el.requestFullscreen({ navigationUI: 'hide' }).catch(() => {});
  }
  if (navigator.wakeLock) { navigator.wakeLock.request('screen').catch(() => {}); }
}

if (qs.get('nofs') === '1') { startEl.remove(); }
// 터치에서는 pointerdown이 사용자 활성화로 인정되지 않아 requestFullscreen이 거부됩니다. click(손을 뗄 때)에서 부릅니다.
startEl.addEventListener('click', () => { enterFullscreen(); startEl.remove(); });
fsBtn.addEventListener('click', (e) => { e.stopPropagation(); enterFullscreen(); });
document.addEventListener('fullscreenchange', () => { fsBtn.style.display = document.fullscreenElement ? 'none' : 'block'; });

if (mainThreadVideo) {
  connectVideo();
} else {
  startVideoWorker();
}
connectInput();
updateStatus();
</script>
</body>
</html>
